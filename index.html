<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golem28 Simulacra Builder</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* CSS Variables for the High-Contrast Vibe */
        :root {
            --bg-color: #050505;
            --text-main: #fbe6d4;
            --accent-purple: #a800b0;
            --accent-yellow: #feca00;
            --accent-orange: #f26522;
            --accent-red: #b30000;
        }

        /* Reusable Title Class to match index.html */
        .zine-title {
            color: var(--bg-color);
            -webkit-text-stroke: 2px var(--text-main);
            text-shadow: 4px 4px 0px var(--accent-orange);
        }
        
        @media (max-width: 600px) {
            .zine-title {
                text-shadow: 2px 2px 0px var(--accent-orange);
            }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        golem: {
                            bg: 'var(--bg-color)',
                            text: 'var(--text-main)',
                            purple: 'var(--accent-purple)',
                            yellow: 'var(--accent-yellow)',
                            orange: 'var(--accent-orange)',
                            red: 'var(--accent-red)',
                            dark: '#111111'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['"Space Mono"', 'monospace'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-golem-bg text-golem-text font-mono selection:bg-golem-red/50 min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS ---
        const SkullIcon = ({ size = 28, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" className={className}><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>
        );

        const HammerIcon = ({ size = 28, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16 4.6V3.75c0-.85-.33-1.65-.93-2.25l-1.25-1.25"/><path d="m10.36 8 3.28 3.28"/></svg>
        );

        const UsersIcon = ({ size = 16, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );

        const DownloadIcon = ({ size = 18, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        const CheckCircleIcon = ({ size = 18, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        );

        // --- DATA DEFINITIONS ---
        const COMPOSITIONS = {
          1: { name: 'The Traditionalists', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 1, golemLimit: 21, lesserGolems: 0, lesserGolemLimit: 15, followers: 2, followerLimit: 12, followerActions: 2 },
          2: { name: 'The Constructors', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 1, golemLimit: 21, lesserGolems: 1, lesserGolemLimit: 15, followers: 1, followerLimit: 12, followerActions: 2 },
          3: { name: 'The Ancient', animators: 1, animatorLimit: 18, animatorActions: 6, golems: 1, golemLimit: 21, lesserGolems: 0, lesserGolemLimit: 15, followers: 1, followerLimit: 12, followerActions: 2 },
          4: { name: 'The Undesirables', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 0, golemLimit: 21, lesserGolems: 1, lesserGolemLimit: 15, followers: 3, followerLimit: 12, followerActions: 2 }
        };

        const ANIMATOR_ATTRS = {
          commandRange: { name: 'Command Range', options: [{ val: '2d6"', cost: 1 }, { val: '2+1d6"', cost: 1 }, { val: '5"', cost: 1 }] },
          durability: { name: 'Durability', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 4 }] },
          clout: { name: 'Clout', options: [{ val: '1', cost: 1 }, { val: '2', cost: 3 }, { val: '3', cost: 5 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 0 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 3 }, { val: '2d6"', cost: 3 }] },
          ward: { name: 'Ward', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }, { val: '4', cost: 6 }] },
          mind: { name: 'Mind', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 3 }] }
        };

        const GOLEM_ATTRS = {
          durability: { name: 'Durability', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          clout: { name: 'Clout', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 1 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 4 }, { val: '2d6"', cost: 7 }] },
          ward: { name: 'Ward', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          mind: { name: 'Mind', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] }
        };

        const FOLLOWER_ATTRS = {
          durability: { name: 'Durability', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 4 }] },
          clout: { name: 'Clout', options: [{ val: '1', cost: 1 }, { val: '2', cost: 3 }, { val: '3', cost: 5 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 0 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 3 }, { val: '2d6"', cost: 3 }] },
          ward: { name: 'Ward', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }, { val: '4', cost: 6 }] },
          mind: { name: 'Mind', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 3 }] }
        };

        const GOLEM_COMMANDS = {
          Movement: [
            { name: 'Dash', cost: 0, desc: "Move up to nimbleness in inches." },
            { name: 'Lash', cost: 1, desc: "Move 1d6-3 inches (push on negative)." }
          ],
          Violence: [
            { name: 'Bash', cost: 0, desc: "Physical attack at range." },
            { name: 'Crash', cost: 2, desc: "Move 1d3\" to target, physical attack with +1D." },
            { name: 'Slash', cost: 2, desc: "Two physical attacks, -1D each." },
            { name: 'Gnash', cost: 2, desc: "Ward save or target is enwrapped." },
            { name: 'Gash', cost: 2, desc: "Physical attack with 1D. Target is gouged." },
            { name: 'Smash', cost: 1, desc: "Physical attack with +1D clout. Push 1d3\"." },
            { name: 'Thrash', cost: 2, desc: "Physical attack on all BtB units (+1D clout)." },
            { name: 'Trash', cost: 1, desc: "Physical attack on BtB (-1D clout). +1d3 dmg to terrain." }
          ],
          Productive: [
            { name: 'Stash', cost: 0, desc: "Pick up item/objective/downed golem." },
            { name: 'Hash', cost: 1, desc: "Ward DC:12+ to recover 1 impairment." },
            { name: 'Mishmash', cost: 1, desc: "Nimbleness roll to steal 1 item from BtB golem." }
          ],
          Magicka: [
            { name: 'Ash', cost: 2, desc: "Mind +1D (DC 10+) to magically attack at range (R-9)\"." },
            { name: 'Flash', cost: 2, desc: "Mind (DC 13+) to magically attack at range (R-12)\"." },
            { name: 'Rash', cost: 2, desc: "Mind DC:12+ to inflict rotting at range (R-11)\"." },
            { name: 'Sash', cost: 2, desc: "Mind DC:10+ to give target +1D to next roll." },
            { name: 'Splash', cost: 2, desc: "Mind DC:10+ to place 5\" -1D splash template." },
            { name: 'Whiplash', cost: 2, desc: "Mind DC:12+ to push target 1d3\" at range (R-11)\"." },
            { name: 'Zash', cost: 1, desc: "Mind DC:10+ to transfer 1d3 durability to target." }
          ]
        };

        // --- HELPER COMPONENTS ---
        const AttributeRow = ({ label, options, currentValue, onChange }) => (
          <div className="flex flex-col sm:flex-row sm:items-center py-3 border-b-2 border-golem-text/20 border-dashed">
            <div className="w-40 font-bold text-golem-orange mb-2 sm:mb-0 uppercase tracking-widest text-xs">
              {label}
            </div>
            <div className="flex flex-wrap gap-2">
              {options.map((opt) => {
                const isSelected = currentValue === opt.val;
                return (
                  <button
                    key={opt.val}
                    onClick={() => onChange(opt.val)}
                    className={`px-3 py-1 text-sm border-2 transition-all font-bold ${
                      isSelected
                        ? 'bg-golem-purple border-golem-purple text-golem-bg shadow-[3px_3px_0_#feca00]'
                        : 'bg-transparent border-golem-text text-golem-text hover:border-golem-yellow hover:text-golem-yellow hover:-translate-y-0.5'
                    }`}
                  >
                    {opt.val} <span className={`text-xs ml-1 ${isSelected ? 'opacity-80' : 'opacity-50'}`}>({opt.cost}W)</span>
                  </button>
                )
              })}
            </div>
          </div>
        );

        const ProgressBar = ({ current, max }) => {
          const percent = Math.min((current / max) * 100, 100);
          const isOver = current > max;
          return (
            <div className="w-full mt-2">
              <div className="flex justify-between text-xs mb-1 uppercase tracking-widest font-bold">
                <span className={isOver ? 'text-golem-red' : 'text-golem-yellow'}>
                  Worth: {current} / {max}
                </span>
                {isOver && <span className="text-golem-red bg-golem-text px-1">OVER LIMIT</span>}
              </div>
              <div className="h-4 bg-transparent border-2 border-golem-text">
                <div 
                  className={`h-full transition-all duration-300 ${isOver ? 'bg-golem-red' : 'bg-golem-yellow'}`}
                  style={{ width: `${percent}%` }}
                />
              </div>
            </div>
          );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
          const [composition, setComposition] = useState('1');
          const [isDownloaded, setIsDownloaded] = useState(false);
          const [simulacrumName, setSimulacrumName] = useState('Unnamed Simulacra');

          const defaultAnimator = { commandRange: '2d6"', durability: '1', nimbleness: '4', clout: '1', physicalRange: 'BtB', ward: '1', mind: '4', name: 'Unnamed Animator' };
          const defaultGolem = { durability: '3', nimbleness: '3', clout: '3', physicalRange: 'BtB', ward: '3', mind: '3', commands: ['Dash', 'Bash', 'Stash'], name: 'Unnamed Golem' };
          const defaultLesserGolem = { durability: '3', nimbleness: '3', clout: '3', physicalRange: 'BtB', ward: '3', mind: '3', commands: ['Dash', 'Bash', 'Stash'], name: 'Unnamed Lesser Golem' };
          const defaultFollower = { durability: '1', nimbleness: '4', clout: '1', physicalRange: 'BtB', ward: '1', mind: '4', name: 'Unnamed Follower' };

          const [animator, setAnimator] = useState({ ...defaultAnimator });
          const [golems, setGolems] = useState([{ ...defaultGolem }]);
          const [lesserGolems, setLesserGolems] = useState([{ ...defaultLesserGolem }]);
          const [followers, setFollowers] = useState([{ ...defaultFollower }, { ...defaultFollower }, { ...defaultFollower }]);

          const getAnimatorCost = () => {
            return Object.entries(animator).reduce((sum, [key, val]) => {
              if (key === 'name') return sum;
              const opt = ANIMATOR_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);
          };

          const getGolemCost = (golemIndex) => {
            const g = golems[golemIndex];
            let cost = Object.entries(g).reduce((sum, [key, val]) => {
              if (key === 'commands' || key === 'name') return sum;
              const opt = GOLEM_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);

            g.commands.forEach(cmdName => {
              let cmdCost = 0;
              Object.values(GOLEM_COMMANDS).forEach(category => {
                const cmd = category.find(c => c.name === cmdName);
                if (cmd) cmdCost = cmd.cost;
              });
              cost += cmdCost;
            });

            return cost;
          };

          const getLesserGolemCost = (golemIndex) => {
            const g = lesserGolems[golemIndex];
            let cost = Object.entries(g).reduce((sum, [key, val]) => {
              if (key === 'commands' || key === 'name') return sum;
              const opt = GOLEM_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);

            g.commands.forEach(cmdName => {
              let cmdCost = 0;
              Object.values(GOLEM_COMMANDS).forEach(category => {
                const cmd = category.find(c => c.name === cmdName);
                if (cmd) cmdCost = cmd.cost;
              });
              cost += cmdCost;
            });

            return cost;
          };

          const getFollowerCost = (followerIndex) => {
            const f = followers[followerIndex];
            return Object.entries(f).reduce((sum, [key, val]) => {
               if (key === 'name') return sum;
               const opt = FOLLOWER_ATTRS[key].options.find(o => o.val === val);
               return sum + (opt ? opt.cost : 0);
            }, 0);
          };

          const updateAnimator = (key, val) => setAnimator({ ...animator, [key]: val });
          
          const updateGolem = (index, key, val) => {
            const newGolems = [...golems];
            newGolems[index] = { ...newGolems[index], [key]: val };
            setGolems(newGolems);
          };

          const updateLesserGolem = (index, key, val) => {
            const newLesserGolems = [...lesserGolems];
            newLesserGolems[index] = { ...newLesserGolems[index], [key]: val };
            setLesserGolems(newLesserGolems);
          };

          const toggleGolemCommand = (golemIndex, cmdName) => {
            const newGolems = [...golems];
            const golem = { ...newGolems[golemIndex] };
            const cmds = golem.commands ? [...golem.commands] : [];
            
            if (cmds.includes(cmdName)) {
              golem.commands = cmds.filter(c => c !== cmdName);
            } else {
              golem.commands = [...cmds, cmdName];
            }
            
            newGolems[golemIndex] = golem;
            setGolems(newGolems);
          };

          const toggleLesserGolemCommand = (golemIndex, cmdName) => {
            const newLesserGolems = [...lesserGolems];
            const golem = { ...newLesserGolems[golemIndex] };
            const cmds = golem.commands ? [...golem.commands] : [];
            
            if (cmds.includes(cmdName)) {
              golem.commands = cmds.filter(c => c !== cmdName);
            } else {
              golem.commands = [...cmds, cmdName];
            }
            
            newLesserGolems[golemIndex] = golem;
            setLesserGolems(newLesserGolems);
          };

          const updateFollower = (index, key, val) => {
            const newFollowers = [...followers];
            newFollowers[index] = { ...newFollowers[index], [key]: val };
            setFollowers(newFollowers);
          };

          const exportList = () => {
            const config = COMPOSITIONS[composition];
            const HLINE = "================================================================================";
            const SLINE = "--------------------------------------------------------------------------------";
            const DLINE = "................................................................................";
            
            const pad = (str, len = 16) => (str + " ".repeat(len)).slice(0, len);

            let text = `${HLINE}\n`;
            text += `                              GOLEM28 SIMULACRA\n`;
            text += `${HLINE}\n`;
            text += ` Name       : ${simulacrumName}\n`;
            text += ` Composition: ${config.name}\n`;
            text += `${HLINE}\n`;

            // Animator Output
            text += ` ANIMATOR: ${animator.name}\n`;
            text += ` [ Worth: ${getAnimatorCost()}/${config.animatorLimit} | Actions: ${config.animatorActions} ]\n`;
            text += `${SLINE}\n`;
            Object.entries(ANIMATOR_ATTRS).forEach(([key, data]) => {
              text += `  ${pad(data.name)} : ${animator[key]}\n`;
            });
            text += `${HLINE}\n`;

            // Golems Output
            for (let i = 0; i < config.golems; i++) {
              text += ` GOLEM ${i + 1}: ${golems[i].name}\n`;
              text += ` [ Worth: ${getGolemCost(i)}/${config.golemLimit} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(GOLEM_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${golems[i][key]}\n`;
              });
              text += `${DLINE}\n`;
              text += `  Commands         : ${golems[i].commands.join(', ') || 'None'}\n`;
              text += `${HLINE}\n`;
            }

            // Lesser Golems Output
            for (let i = 0; i < config.lesserGolems; i++) {
              text += ` LESSER GOLEM ${i + 1}: ${lesserGolems[i].name}\n`;
              text += ` [ Worth: ${getLesserGolemCost(i)}/${config.lesserGolemLimit} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(GOLEM_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${lesserGolems[i][key]}\n`;
              });
              text += `${DLINE}\n`;
              text += `  Commands         : ${lesserGolems[i].commands.join(', ') || 'None'}\n`;
              text += `${HLINE}\n`;
            }

            // Followers Output
            for (let i = 0; i < config.followers; i++) {
              text += ` FOLLOWER ${i + 1}: ${followers[i].name}\n`;
              text += ` [ Worth: ${getFollowerCost(i)}/${config.followerLimit} | Actions: ${config.followerActions} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(FOLLOWER_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${followers[i][key]}\n`;
              });
              text += `${HLINE}\n`;
            }

            text += `  "From ash to ash and dust to dust. A god of things gathers its dust."\n`;
            text += `${HLINE}\n`;

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            const safeName = simulacrumName.trim().replace(/\s+/g, '-');
            a.download = `Golem28-Simulacra-${safeName}.txt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setIsDownloaded(true);
            setTimeout(() => setIsDownloaded(false), 2000);
          };

          return (
            <div>
              {/* Header */}
              <header className="text-center py-16 border-b-4 border-golem-text mb-12">
                <h1 className="zine-title text-5xl sm:text-7xl font-serif font-bold tracking-widest uppercase mb-2">Golem28</h1>
                <div className="text-xl text-golem-orange font-bold tracking-widest uppercase mb-6">Simulacra Builder</div>
                <p className="text-sm text-golem-text max-w-xl mx-auto px-4 italic opacity-80">
                  "A crown for the king, a hole for a soul, To wake the golem and make it whole."
                </p>
              </header>

              <main className="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 space-y-12 mb-20">
                
                {/* Top Controls: Name & Composition */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  
                  {/* Simulacrum Name Input */}
                  <div className="lg:col-span-1 bg-golem-dark border-2 border-golem-text p-6 shadow-[8px_8px_0_var(--accent-purple)] flex flex-col gap-4">
                    <label className="text-golem-orange font-bold uppercase tracking-widest text-sm flex items-center gap-2">
                      Simulacrum Name:
                    </label>
                    <input 
                      type="text" 
                      value={simulacrumName}
                      onChange={(e) => setSimulacrumName(e.target.value)}
                      className="bg-transparent text-2xl font-serif font-bold text-golem-yellow focus:outline-none border-b-2 border-dashed border-golem-text focus:border-golem-yellow transition-colors w-full"
                      placeholder="Name your Simulacrum..."
                    />
                  </div>

                  {/* Composition & Download */}
                  <div className="lg:col-span-2 bg-golem-bg border-2 border-golem-text p-6 shadow-[8px_8px_0_var(--accent-red)] flex flex-col justify-between gap-4">
                    <div>
                      <h2 className="text-sm uppercase tracking-widest text-golem-text mb-4 font-bold flex items-center gap-2">
                        <UsersIcon size={16} /> Select Composition
                      </h2>
                      <div className="flex flex-wrap gap-3">
                        {Object.entries(COMPOSITIONS).map(([key, config]) => {
                          const isSelected = composition === key;
                          return (
                            <button
                              key={key}
                              onClick={() => setComposition(key)}
                              className={`px-4 py-2 border-2 font-bold uppercase text-xs tracking-wider transition-all ${
                                isSelected 
                                  ? 'bg-golem-orange border-golem-orange text-golem-bg shadow-[4px_4px_0_var(--text-main)]' 
                                  : 'bg-transparent border-golem-text text-golem-text hover:border-golem-yellow hover:text-golem-yellow hover:-translate-y-1'
                              }`}
                            >
                              <div>{config.name}</div>
                            </button>
                          )
                        })}
                      </div>
                      <div className="mt-3 text-xs text-golem-yellow/80 font-bold uppercase tracking-wider">
                        Provides: {COMPOSITIONS[composition].animators} Anim, {COMPOSITIONS[composition].golems} Gol, {COMPOSITIONS[composition].lesserGolems} L.Gol, {COMPOSITIONS[composition].followers} Fol
                      </div>
                    </div>
                    
                    <div className="flex justify-end mt-4">
                      <button 
                        onClick={exportList}
                        className={`flex items-center gap-2 px-6 py-3 border-2 transition-all font-bold uppercase tracking-widest text-sm ${
                          isDownloaded 
                            ? 'bg-golem-text text-golem-bg border-golem-text' 
                            : 'bg-golem-yellow text-golem-bg border-golem-yellow shadow-[6px_6px_0_var(--accent-red)] hover:translate-y-1 hover:shadow-[2px_2px_0_var(--accent-red)]'
                        }`}
                      >
                        {isDownloaded ? <CheckCircleIcon size={18} /> : <DownloadIcon size={18} />}
                        {isDownloaded ? 'Roster Saved' : 'Download Roster'}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Animator Section */}
                <section className="bg-golem-bg border-2 border-golem-text shadow-[12px_12px_0_var(--accent-purple)]">
                  <div className="bg-golem-dark border-b-2 border-golem-text p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-6">
                    <div className="flex items-center gap-3 w-full sm:w-auto">
                      <SkullIcon className="text-golem-red shrink-0" size={32} />
                      <input 
                        type="text" 
                        value={animator.name}
                        onChange={(e) => updateAnimator('name', e.target.value)}
                        className="bg-transparent text-2xl sm:text-3xl font-serif font-bold text-golem-text focus:outline-none border-b-2 border-dashed border-golem-text/50 focus:border-golem-yellow transition-colors w-full"
                        placeholder="Animator Name"
                      />
                    </div>
                    <div className="w-full sm:w-64 shrink-0">
                      <ProgressBar current={getAnimatorCost()} max={COMPOSITIONS[composition].animatorLimit} />
                    </div>
                  </div>
                  <div className="p-4 sm:p-6 grid gap-2">
                    {Object.entries(ANIMATOR_ATTRS).map(([key, data]) => (
                      <AttributeRow
                        key={key}
                        label={data.name}
                        options={data.options}
                        currentValue={animator[key]}
                        onChange={(val) => updateAnimator(key, val)}
                      />
                    ))}
                  </div>
                </section>

                {/* Golems Section */}
                {Array.from({ length: COMPOSITIONS[composition].golems }).map((_, i) => (
                  <section key={`golem-${i}`} className="bg-golem-bg border-2 border-golem-text shadow-[12px_12px_0_var(--accent-yellow)]">
                    <div className="bg-golem-dark border-b-2 border-golem-text p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-6">
                      <div className="flex items-center gap-3 w-full sm:w-auto">
                        <HammerIcon className="text-golem-yellow shrink-0" size={32} />
                        <input 
                          type="text" 
                          value={golems[i].name}
                          onChange={(e) => updateGolem(i, 'name', e.target.value)}
                          className="bg-transparent text-2xl sm:text-3xl font-serif font-bold text-golem-text focus:outline-none border-b-2 border-dashed border-golem-text/50 focus:border-golem-yellow transition-colors w-full"
                          placeholder={`Golem ${i + 1} Name`}
                        />
                      </div>
                      <div className="w-full sm:w-64 shrink-0">
                        <ProgressBar current={getGolemCost(i)} max={COMPOSITIONS[composition].golemLimit} />
                      </div>
                    </div>
                    
                    <div className="p-4 sm:p-6 border-b-2 border-golem-text grid gap-2 bg-[#0c0c0c]">
                      <h3 className="text-sm font-serif font-bold uppercase tracking-widest text-golem-text mb-2 flex items-center gap-2">
                        <span className="w-2 h-2 bg-golem-yellow inline-block"></span> Base Attributes
                      </h3>
                      {Object.entries(GOLEM_ATTRS).map(([key, data]) => (
                        <AttributeRow
                          key={key}
                          label={data.name}
                          options={data.options}
                          currentValue={golems[i][key]}
                          onChange={(val) => updateGolem(i, key, val)}
                        />
                      ))}
                    </div>

                    <div className="p-4 sm:p-6 bg-golem-bg">
                      <h3 className="text-sm font-serif font-bold uppercase tracking-widest text-golem-text mb-4 flex items-center gap-2">
                         <span className="w-2 h-2 bg-golem-red inline-block"></span> Commands
                      </h3>
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {Object.entries(GOLEM_COMMANDS).map(([category, cmds]) => (
                          <div key={category} className="border-2 border-golem-text p-4">
                            <h4 className="text-sm font-bold uppercase tracking-widest text-golem-yellow border-b-2 border-dashed border-golem-text/50 pb-2 mb-3">{category}</h4>
                            <div className="space-y-3 mt-4">
                              {cmds.map(cmd => {
                                const isSelected = golems[i].commands.includes(cmd.name);
                                return (
                                  <button 
                                    type="button"
                                    onClick={() => toggleGolemCommand(i, cmd.name)}
                                    key={cmd.name} 
                                    className={`w-full text-left flex items-start gap-3 p-3 cursor-pointer transition-all border-2 ${
                                      isSelected 
                                        ? 'bg-golem-dark border-golem-yellow shadow-[4px_4px_0_var(--accent-yellow)]' 
                                        : 'bg-transparent border-transparent hover:border-golem-text/50 border-dashed'
                                    }`}
                                  >
                                    <div className={`mt-0.5 w-4 h-4 border-2 shrink-0 ${isSelected ? 'bg-golem-yellow border-golem-yellow' : 'bg-transparent border-golem-text'}`}>
                                       {isSelected && <div className="w-full h-full bg-golem-yellow"></div>}
                                    </div>
                                    <div className="flex-1 leading-snug">
                                      <div className="flex justify-between items-center">
                                        <span className={`font-bold uppercase tracking-wider text-sm ${isSelected ? 'text-golem-yellow' : 'text-golem-text'}`}>
                                          {cmd.name}
                                        </span>
                                        <span className="text-xs text-golem-text/70 font-bold">({cmd.cost}W)</span>
                                      </div>
                                      <p className="text-xs text-golem-text/80 mt-1">{cmd.desc}</p>
                                    </div>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                ))}

                {/* Lesser Golems Section */}
                {Array.from({ length: COMPOSITIONS[composition].lesserGolems }).map((_, i) => (
                  <section key={`lesser-golem-${i}`} className="bg-golem-bg border-2 border-golem-text shadow-[12px_12px_0_var(--accent-orange)]">
                    <div className="bg-golem-dark border-b-2 border-golem-text p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-6">
                      <div className="flex items-center gap-3 w-full sm:w-auto">
                        <HammerIcon className="text-golem-orange shrink-0" size={28} />
                        <input 
                          type="text" 
                          value={lesserGolems[i].name}
                          onChange={(e) => updateLesserGolem(i, 'name', e.target.value)}
                          className="bg-transparent text-xl sm:text-2xl font-serif font-bold text-golem-text focus:outline-none border-b-2 border-dashed border-golem-text/50 focus:border-golem-yellow transition-colors w-full"
                          placeholder={`Lesser Golem ${i + 1} Name`}
                        />
                      </div>
                      <div className="w-full sm:w-64 shrink-0">
                        <ProgressBar current={getLesserGolemCost(i)} max={COMPOSITIONS[composition].lesserGolemLimit} />
                      </div>
                    </div>
                    
                    <div className="p-4 sm:p-6 border-b-2 border-golem-text grid gap-2 bg-[#0c0c0c]">
                      <h3 className="text-sm font-serif font-bold uppercase tracking-widest text-golem-text mb-2 flex items-center gap-2">
                        <span className="w-2 h-2 bg-golem-orange inline-block"></span> Base Attributes
                      </h3>
                      {Object.entries(GOLEM_ATTRS).map(([key, data]) => (
                        <AttributeRow
                          key={key}
                          label={data.name}
                          options={data.options}
                          currentValue={lesserGolems[i][key]}
                          onChange={(val) => updateLesserGolem(i, key, val)}
                        />
                      ))}
                    </div>

                    <div className="p-4 sm:p-6 bg-golem-bg">
                      <h3 className="text-sm font-serif font-bold uppercase tracking-widest text-golem-text mb-4 flex items-center gap-2">
                         <span className="w-2 h-2 bg-golem-red inline-block"></span> Commands
                      </h3>
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {Object.entries(GOLEM_COMMANDS).map(([category, cmds]) => (
                          <div key={category} className="border-2 border-golem-text p-4">
                            <h4 className="text-sm font-bold uppercase tracking-widest text-golem-orange border-b-2 border-dashed border-golem-text/50 pb-2 mb-3">{category}</h4>
                            <div className="space-y-3 mt-4">
                              {cmds.map(cmd => {
                                const isSelected = lesserGolems[i].commands.includes(cmd.name);
                                return (
                                  <button 
                                    type="button"
                                    onClick={() => toggleLesserGolemCommand(i, cmd.name)}
                                    key={cmd.name} 
                                    className={`w-full text-left flex items-start gap-3 p-3 cursor-pointer transition-all border-2 ${
                                      isSelected 
                                        ? 'bg-golem-dark border-golem-orange shadow-[4px_4px_0_var(--accent-orange)]' 
                                        : 'bg-transparent border-transparent hover:border-golem-text/50 border-dashed'
                                    }`}
                                  >
                                    <div className={`mt-0.5 w-4 h-4 border-2 shrink-0 ${isSelected ? 'bg-golem-orange border-golem-orange' : 'bg-transparent border-golem-text'}`}>
                                       {isSelected && <div className="w-full h-full bg-golem-orange"></div>}
                                    </div>
                                    <div className="flex-1 leading-snug">
                                      <div className="flex justify-between items-center">
                                        <span className={`font-bold uppercase tracking-wider text-sm ${isSelected ? 'text-golem-orange' : 'text-golem-text'}`}>
                                          {cmd.name}
                                        </span>
                                        <span className="text-xs text-golem-text/70 font-bold">({cmd.cost}W)</span>
                                      </div>
                                      <p className="text-xs text-golem-text/80 mt-1">{cmd.desc}</p>
                                    </div>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                ))}

                {/* Followers Section */}
                {COMPOSITIONS[composition].followers > 0 && (
                  <div className="space-y-6 pt-8">
                    <h2 className="text-3xl font-serif font-bold text-golem-text border-b-4 border-golem-text pb-4 uppercase tracking-widest">
                      Followers
                    </h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                      {Array.from({ length: COMPOSITIONS[composition].followers }).map((_, i) => (
                        <section key={`follower-${i}`} className="bg-golem-bg border-2 border-golem-text shadow-[8px_8px_0_var(--accent-red)] flex flex-col">
                          <div className="bg-golem-dark border-b-2 border-golem-text p-4 flex flex-col gap-4">
                            <input 
                              type="text" 
                              value={followers[i].name}
                              onChange={(e) => updateFollower(i, 'name', e.target.value)}
                              className="bg-transparent text-xl font-serif font-bold text-golem-red focus:outline-none border-b-2 border-dashed border-golem-text/50 focus:border-golem-yellow transition-colors w-full"
                              placeholder={`Follower ${i + 1}`}
                            />
                            <ProgressBar current={getFollowerCost(i)} max={COMPOSITIONS[composition].followerLimit} />
                          </div>
                          <div className="p-4 grid gap-4 flex-1 text-sm bg-[#0c0c0c]">
                            {Object.entries(FOLLOWER_ATTRS).map(([key, data]) => (
                              <div key={key} className="flex justify-between items-center border-b border-golem-text/20 pb-2 border-dashed">
                                <span className="font-bold text-golem-text uppercase tracking-wider text-xs">{data.name}</span>
                                <select 
                                  className="bg-golem-dark border-2 border-golem-text text-golem-yellow font-bold uppercase tracking-wider p-1 text-xs focus:border-golem-yellow outline-none appearance-none cursor-pointer text-center min-w-[80px]"
                                  value={followers[i][key]}
                                  onChange={(e) => updateFollower(i, key, e.target.value)}
                                >
                                  {data.options.map(opt => (
                                    <option key={opt.val} value={opt.val}>{opt.val} ({opt.cost}W)</option>
                                  ))}
                                </select>
                              </div>
                            ))}
                          </div>
                        </section>
                      ))}
                    </div>
                  </div>
                )}

              </main>

              <footer className="text-center py-10 mt-12 border-t-4 border-golem-text bg-golem-dark text-golem-text font-serif">
                <p className="uppercase tracking-widest font-bold mb-2">Golem28 Simulacra Builder</p>
                <p className="text-sm opacity-80 italic">Built for the skirmish kitbasher.</p>
              </footer>
            </div>
          );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
