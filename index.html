<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golem28 Simulacra Builder</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#131110] text-stone-300 font-sans selection:bg-red-900/50">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS ---
        const SkullIcon = ({ size = 28, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>
        );

        const HammerIcon = ({ size = 28, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16 4.6V3.75c0-.85-.33-1.65-.93-2.25l-1.25-1.25"/><path d="m10.36 8 3.28 3.28"/></svg>
        );

        const UsersIcon = ({ size = 16, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );

        const DownloadIcon = ({ size = 18, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        const CheckCircleIcon = ({ size = 18, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        );

        // --- DATA DEFINITIONS ---
        const COMPOSITIONS = {
          1: { name: 'The Traditionalists', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 1, golemLimit: 21, lesserGolems: 0, lesserGolemLimit: 15, followers: 2, followerLimit: 12, followerActions: 2 },
          2: { name: 'The Constructors', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 1, golemLimit: 21, lesserGolems: 1, lesserGolemLimit: 15, followers: 1, followerLimit: 12, followerActions: 2 },
          3: { name: 'The Ancient', animators: 1, animatorLimit: 18, animatorActions: 6, golems: 1, golemLimit: 21, lesserGolems: 0, lesserGolemLimit: 15, followers: 1, followerLimit: 12, followerActions: 2 },
          4: { name: 'The Undesirables', animators: 1, animatorLimit: 15, animatorActions: 4, golems: 0, golemLimit: 21, lesserGolems: 1, lesserGolemLimit: 15, followers: 3, followerLimit: 12, followerActions: 2 }
        };

        const ANIMATOR_ATTRS = {
          commandRange: { name: 'Command Range', options: [{ val: '2d6"', cost: 1 }, { val: '2+1d6"', cost: 1 }, { val: '5"', cost: 1 }] },
          durability: { name: 'Durability', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 4 }] },
          clout: { name: 'Clout', options: [{ val: '1', cost: 1 }, { val: '2', cost: 3 }, { val: '3', cost: 5 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 0 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 3 }, { val: '2d6"', cost: 3 }] },
          ward: { name: 'Ward', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }, { val: '4', cost: 6 }] },
          mind: { name: 'Mind', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 3 }] }
        };

        const GOLEM_ATTRS = {
          durability: { name: 'Durability', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          clout: { name: 'Clout', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 1 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 4 }, { val: '2d6"', cost: 7 }] },
          ward: { name: 'Ward', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] },
          mind: { name: 'Mind', options: [{ val: '3', cost: 1 }, { val: '4', cost: 2 }, { val: '5', cost: 4 }, { val: '6', cost: 7 }] }
        };

        const FOLLOWER_ATTRS = {
          durability: { name: 'Durability', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }] },
          nimbleness: { name: 'Nimbleness', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 4 }] },
          clout: { name: 'Clout', options: [{ val: '1', cost: 1 }, { val: '2', cost: 3 }, { val: '3', cost: 5 }] },
          physicalRange: { name: 'Physical Range', options: [{ val: 'BtB', cost: 0 }, { val: '3"', cost: 2 }, { val: '1+1d6"', cost: 3 }, { val: '2d6"', cost: 3 }] },
          ward: { name: 'Ward', options: [{ val: '1', cost: 1 }, { val: '2', cost: 2 }, { val: '3', cost: 4 }, { val: '4', cost: 6 }] },
          mind: { name: 'Mind', options: [{ val: '4', cost: 1 }, { val: '5', cost: 2 }, { val: '6', cost: 3 }] }
        };

        const GOLEM_COMMANDS = {
          Movement: [
            { name: 'Dash', cost: 0, desc: "Move up to nimbleness in inches." },
            { name: 'Lash', cost: 1, desc: "Move 1d6-3 inches (push on negative)." }
          ],
          Violence: [
            { name: 'Bash', cost: 0, desc: "Physical attack at range." },
            { name: 'Crash', cost: 2, desc: "Move 1d3\" to target, physical attack with +1D." },
            { name: 'Slash', cost: 2, desc: "Two physical attacks, -1D each." },
            { name: 'Gnash', cost: 2, desc: "Ward save or target is enwrapped." },
            { name: 'Gash', cost: 2, desc: "Physical attack with 1D. Target is gouged." },
            { name: 'Smash', cost: 1, desc: "Physical attack with +1D clout. Push 1d3\"." },
            { name: 'Thrash', cost: 2, desc: "Physical attack on all BtB units (+1D clout)." },
            { name: 'Trash', cost: 1, desc: "Physical attack on BtB (-1D clout). +1d3 dmg to terrain." }
          ],
          Productive: [
            { name: 'Stash', cost: 0, desc: "Pick up item/objective/downed golem." },
            { name: 'Hash', cost: 1, desc: "Ward DC:12+ to recover 1 impairment." },
            { name: 'Mishmash', cost: 1, desc: "Nimbleness roll to steal 1 item from BtB golem." }
          ],
          Magicka: [
            { name: 'Ash', cost: 2, desc: "Mind +1D (DC 10+) to magically attack at range (R-9)\"." },
            { name: 'Flash', cost: 2, desc: "Mind (DC 13+) to magically attack at range (R-12)\"." },
            { name: 'Rash', cost: 2, desc: "Mind DC:12+ to inflict rotting at range (R-11)\"." },
            { name: 'Sash', cost: 2, desc: "Mind DC:10+ to give target +1D to next roll." },
            { name: 'Splash', cost: 2, desc: "Mind DC:10+ to place 5\" -1D splash template." },
            { name: 'Whiplash', cost: 2, desc: "Mind DC:12+ to push target 1d3\" at range (R-11)\"." },
            { name: 'Zash', cost: 1, desc: "Mind DC:10+ to transfer 1d3 durability to target." }
          ]
        };

        // --- HELPER COMPONENTS ---
        const AttributeRow = ({ label, options, currentValue, onChange }) => (
          <div className="flex flex-col sm:flex-row sm:items-center py-2 border-b border-stone-800">
            <div className="w-40 font-bold text-stone-400 mb-2 sm:mb-0 uppercase tracking-wider text-xs">
              {label}
            </div>
            <div className="flex flex-wrap gap-2">
              {options.map((opt) => (
                <button
                  key={opt.val}
                  onClick={() => onChange(opt.val)}
                  className={`px-3 py-1 text-sm rounded border transition-colors ${
                    currentValue === opt.val
                      ? 'bg-red-900/40 border-red-500 text-stone-100 shadow-[0_0_10px_rgba(239,68,68,0.2)]'
                      : 'bg-stone-900 border-stone-700 text-stone-500 hover:border-stone-500 hover:text-stone-300'
                  }`}
                >
                  {opt.val} <span className="text-xs opacity-50 ml-1">({opt.cost}W)</span>
                </button>
              ))}
            </div>
          </div>
        );

        const ProgressBar = ({ current, max }) => {
          const percent = Math.min((current / max) * 100, 100);
          const isOver = current > max;
          return (
            <div className="w-full mt-2">
              <div className="flex justify-between text-xs mb-1 uppercase tracking-wider">
                <span className={isOver ? 'text-red-500 font-bold' : 'text-stone-400'}>
                  Worth: {current} / {max}
                </span>
                {isOver && <span className="text-red-500">Over Limit!</span>}
              </div>
              <div className="h-2 bg-stone-900 rounded-full overflow-hidden border border-stone-700">
                <div 
                  className={`h-full transition-all duration-300 ${isOver ? 'bg-red-600' : 'bg-stone-500'}`}
                  style={{ width: `${percent}%` }}
                />
              </div>
            </div>
          );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
          const [composition, setComposition] = useState('1');
          const [isDownloaded, setIsDownloaded] = useState(false);
          const [simulacrumName, setSimulacrumName] = useState('Unnamed Simulacra');

          const defaultAnimator = { commandRange: '2d6"', durability: '1', nimbleness: '4', clout: '1', physicalRange: 'BtB', ward: '1', mind: '4', name: 'Unnamed Animator' };
          const defaultGolem = { durability: '3', nimbleness: '3', clout: '3', physicalRange: 'BtB', ward: '3', mind: '3', commands: ['Dash', 'Bash', 'Stash'], name: 'Unnamed Golem' };
          const defaultLesserGolem = { durability: '3', nimbleness: '3', clout: '3', physicalRange: 'BtB', ward: '3', mind: '3', commands: ['Dash', 'Bash', 'Stash'], name: 'Unnamed Lesser Golem' };
          const defaultFollower = { durability: '1', nimbleness: '4', clout: '1', physicalRange: 'BtB', ward: '1', mind: '4', name: 'Unnamed Follower' };

          const [animator, setAnimator] = useState({ ...defaultAnimator });
          const [golems, setGolems] = useState([{ ...defaultGolem }]);
          const [lesserGolems, setLesserGolems] = useState([{ ...defaultLesserGolem }]);
          const [followers, setFollowers] = useState([{ ...defaultFollower }, { ...defaultFollower }, { ...defaultFollower }]);

          const getAnimatorCost = () => {
            return Object.entries(animator).reduce((sum, [key, val]) => {
              if (key === 'name') return sum;
              const opt = ANIMATOR_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);
          };

          const getGolemCost = (golemIndex) => {
            const g = golems[golemIndex];
            let cost = Object.entries(g).reduce((sum, [key, val]) => {
              if (key === 'commands' || key === 'name') return sum;
              const opt = GOLEM_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);

            g.commands.forEach(cmdName => {
              let cmdCost = 0;
              Object.values(GOLEM_COMMANDS).forEach(category => {
                const cmd = category.find(c => c.name === cmdName);
                if (cmd) cmdCost = cmd.cost;
              });
              cost += cmdCost;
            });

            return cost;
          };

          const getLesserGolemCost = (golemIndex) => {
            const g = lesserGolems[golemIndex];
            let cost = Object.entries(g).reduce((sum, [key, val]) => {
              if (key === 'commands' || key === 'name') return sum;
              const opt = GOLEM_ATTRS[key].options.find(o => o.val === val);
              return sum + (opt ? opt.cost : 0);
            }, 0);

            g.commands.forEach(cmdName => {
              let cmdCost = 0;
              Object.values(GOLEM_COMMANDS).forEach(category => {
                const cmd = category.find(c => c.name === cmdName);
                if (cmd) cmdCost = cmd.cost;
              });
              cost += cmdCost;
            });

            return cost;
          };

          const getFollowerCost = (followerIndex) => {
            const f = followers[followerIndex];
            return Object.entries(f).reduce((sum, [key, val]) => {
               if (key === 'name') return sum;
               const opt = FOLLOWER_ATTRS[key].options.find(o => o.val === val);
               return sum + (opt ? opt.cost : 0);
            }, 0);
          };

          const updateAnimator = (key, val) => setAnimator({ ...animator, [key]: val });
          
          const updateGolem = (index, key, val) => {
            const newGolems = [...golems];
            newGolems[index][key] = val;
            setGolems(newGolems);
          };

          const updateLesserGolem = (index, key, val) => {
            const newLesserGolems = [...lesserGolems];
            newLesserGolems[index][key] = val;
            setLesserGolems(newLesserGolems);
          };

          const toggleGolemCommand = (golemIndex, cmdName) => {
            const newGolems = [...golems];
            const cmds = newGolems[golemIndex].commands;
            if (cmds.includes(cmdName)) {
              newGolems[golemIndex].commands = cmds.filter(c => c !== cmdName);
            } else {
              newGolems[golemIndex].commands.push(cmdName);
            }
            setGolems(newGolems);
          };

          const toggleLesserGolemCommand = (golemIndex, cmdName) => {
            const newGolems = [...lesserGolems];
            const cmds = newGolems[golemIndex].commands;
            if (cmds.includes(cmdName)) {
              newGolems[golemIndex].commands = cmds.filter(c => c !== cmdName);
            } else {
              newGolems[golemIndex].commands.push(cmdName);
            }
            setLesserGolems(newGolems);
          };

          const updateFollower = (index, key, val) => {
            const newFollowers = [...followers];
            newFollowers[index][key] = val;
            setFollowers(newFollowers);
          };

          const exportList = () => {
            const config = COMPOSITIONS[composition];
            const HLINE = "================================================================================";
            const SLINE = "--------------------------------------------------------------------------------";
            const DLINE = "................................................................................";
            
            const pad = (str, len = 16) => (str + " ".repeat(len)).slice(0, len);

            let text = `${HLINE}\n`;
            text += `                              GOLEM28 SIMULACRA\n`;
            text += `${HLINE}\n`;
            text += ` Name       : ${simulacrumName}\n`;
            text += ` Composition: ${config.name}\n`;
            text += `${HLINE}\n`;

            // Animator Output
            text += ` ANIMATOR: ${animator.name}\n`;
            text += ` [ Worth: ${getAnimatorCost()}/${config.animatorLimit} | Actions: ${config.animatorActions} ]\n`;
            text += `${SLINE}\n`;
            Object.entries(ANIMATOR_ATTRS).forEach(([key, data]) => {
              text += `  ${pad(data.name)} : ${animator[key]}\n`;
            });
            text += `${HLINE}\n`;

            // Golems Output
            for (let i = 0; i < config.golems; i++) {
              text += ` GOLEM ${i + 1}: ${golems[i].name}\n`;
              text += ` [ Worth: ${getGolemCost(i)}/${config.golemLimit} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(GOLEM_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${golems[i][key]}\n`;
              });
              text += `${DLINE}\n`;
              text += `  Commands         : ${golems[i].commands.join(', ') || 'None'}\n`;
              text += `${HLINE}\n`;
            }

            // Lesser Golems Output
            for (let i = 0; i < config.lesserGolems; i++) {
              text += ` LESSER GOLEM ${i + 1}: ${lesserGolems[i].name}\n`;
              text += ` [ Worth: ${getLesserGolemCost(i)}/${config.lesserGolemLimit} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(GOLEM_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${lesserGolems[i][key]}\n`;
              });
              text += `${DLINE}\n`;
              text += `  Commands         : ${lesserGolems[i].commands.join(', ') || 'None'}\n`;
              text += `${HLINE}\n`;
            }

            // Followers Output
            for (let i = 0; i < config.followers; i++) {
              text += ` FOLLOWER ${i + 1}: ${followers[i].name}\n`;
              text += ` [ Worth: ${getFollowerCost(i)}/${config.followerLimit} | Actions: ${config.followerActions} ]\n`;
              text += `${SLINE}\n`;
              Object.entries(FOLLOWER_ATTRS).forEach(([key, data]) => {
                text += `  ${pad(data.name)} : ${followers[i][key]}\n`;
              });
              text += `${HLINE}\n`;
            }

            text += `  "From ash to ash and dust to dust. A god of things gathers its dust."\n`;
            text += `${HLINE}\n`;

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            const safeName = simulacrumName.trim().replace(/\s+/g, '-');
            a.download = `Golem28-Simulacra-${safeName}.txt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setIsDownloaded(true);
            setTimeout(() => setIsDownloaded(false), 2000);
          };

          return (
            <div className="min-h-screen">
              
              {/* Header */}
              <header className="bg-[#0a0908] border-b border-stone-800 p-6 sm:p-8 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-full opacity-5 pointer-events-none" 
                     style={{ backgroundImage: 'radial-gradient(circle, #ef4444 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
                <h1 className="text-4xl sm:text-5xl font-serif font-bold text-stone-100 tracking-widest uppercase">Golem28</h1>
                <p className="text-red-800 font-serif italic mt-2 text-lg">A Skirmish Kitbasher</p>
                <p className="text-sm text-stone-500 max-w-xl mx-auto mt-4 font-serif">
                  "From ash to ash and dust to dust. A god of things gathers its rust.<br/>
                  A crown for the king, a hole for a soul, To wake the golem and make it whole."
                </p>
              </header>

              <main className="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
                
                {/* Simulacrum Name Input */}
                <div className="bg-stone-900 border border-stone-800 rounded-xl p-6 shadow-2xl flex flex-col sm:flex-row items-start sm:items-center gap-4">
                  <div className="text-red-700 font-bold uppercase tracking-widest text-sm flex items-center gap-2">
                    Simulacrum:
                  </div>
                  <input 
                    type="text" 
                    value={simulacrumName}
                    onChange={(e) => setSimulacrumName(e.target.value)}
                    className="bg-transparent text-3xl font-serif font-bold text-stone-100 focus:outline-none border-b border-dashed border-stone-700 focus:border-red-800 hover:border-stone-500 transition-colors w-full flex-1"
                    placeholder="Name your Simulacrum..."
                  />
                </div>

                {/* Composition & Tools */}
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-stone-900/50 p-4 rounded-lg border border-stone-800 shadow-xl backdrop-blur-sm">
                  <div className="flex-1">
                    <h2 className="text-sm uppercase tracking-widest text-stone-500 mb-2 font-bold flex items-center gap-2">
                      <UsersIcon size={16} /> Simulacra Composition
                    </h2>
                    <div className="flex flex-wrap gap-2">
                      {Object.entries(COMPOSITIONS).map(([key, config]) => (
                        <button
                          key={key}
                          onClick={() => setComposition(key)}
                          className={`px-4 py-2 rounded font-medium transition-all text-sm sm:text-base ${
                            composition === key 
                              ? 'bg-red-950/50 border-red-800 text-red-200 border shadow-inner' 
                              : 'bg-stone-950 border border-stone-800 text-stone-400 hover:bg-stone-800 hover:text-stone-200'
                          }`}
                        >
                          <div className="font-bold">{config.name}</div>
                          <div className="text-xs opacity-75 mt-1">
                            {config.animators} Anim, {config.golems} Gol, {config.lesserGolems} L.Gol, {config.followers} Fol
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <button 
                    onClick={exportList}
                    className="flex items-center gap-2 px-6 py-3 bg-stone-800 hover:bg-stone-700 text-stone-200 rounded border border-stone-600 transition-colors shadow-lg self-stretch md:self-auto"
                  >
                    {isDownloaded ? <CheckCircleIcon size={18} className="text-green-500" /> : <DownloadIcon size={18} />}
                    {isDownloaded ? 'Downloaded!' : 'Download Roster'}
                  </button>
                </div>

                {/* Animator Section */}
                <section className="bg-stone-900 border border-stone-800 rounded-xl shadow-2xl overflow-hidden">
                  <div className="bg-[#1a1816] border-b border-stone-800 p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                    <div className="flex items-center gap-3">
                      <SkullIcon className="text-red-700" size={28} />
                      <input 
                        type="text" 
                        value={animator.name}
                        onChange={(e) => updateAnimator('name', e.target.value)}
                        className="bg-transparent text-2xl font-serif font-bold text-stone-100 focus:outline-none border-b border-dashed border-stone-700 focus:border-red-800 hover:border-stone-500 transition-colors w-full sm:w-auto"
                        placeholder="Animator Name"
                      />
                    </div>
                    <div className="w-full sm:w-48 shrink-0">
                      <ProgressBar current={getAnimatorCost()} max={COMPOSITIONS[composition].animatorLimit} />
                    </div>
                  </div>
                  <div className="p-4 sm:p-6 grid gap-2">
                    {Object.entries(ANIMATOR_ATTRS).map(([key, data]) => (
                      <AttributeRow
                        key={key}
                        label={data.name}
                        options={data.options}
                        currentValue={animator[key]}
                        onChange={(val) => updateAnimator(key, val)}
                      />
                    ))}
                  </div>
                </section>

                {/* Golems Section */}
                {Array.from({ length: COMPOSITIONS[composition].golems }).map((_, i) => (
                  <section key={`golem-${i}`} className="bg-stone-900 border border-stone-800 rounded-xl shadow-2xl overflow-hidden">
                    <div className="bg-[#1a1816] border-b border-stone-800 p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                      <div className="flex items-center gap-3">
                        <HammerIcon className="text-stone-500" size={28} />
                        <input 
                          type="text" 
                          value={golems[i].name}
                          onChange={(e) => updateGolem(i, 'name', e.target.value)}
                          className="bg-transparent text-2xl font-serif font-bold text-stone-100 focus:outline-none border-b border-dashed border-stone-700 focus:border-stone-500 transition-colors w-full sm:w-auto"
                          placeholder={`Golem ${i + 1} Name`}
                        />
                      </div>
                      <div className="w-full sm:w-48 shrink-0">
                        <ProgressBar current={getGolemCost(i)} max={COMPOSITIONS[composition].golemLimit} />
                      </div>
                    </div>
                    
                    <div className="p-4 sm:p-6 border-b border-stone-800 grid gap-2">
                      <h3 className="text-sm font-bold uppercase tracking-widest text-stone-500 mb-2">Attributes</h3>
                      {Object.entries(GOLEM_ATTRS).map(([key, data]) => (
                        <AttributeRow
                          key={key}
                          label={data.name}
                          options={data.options}
                          currentValue={golems[i][key]}
                          onChange={(val) => updateGolem(i, key, val)}
                        />
                      ))}
                    </div>

                    <div className="p-4 sm:p-6 bg-stone-950/30">
                      <h3 className="text-sm font-bold uppercase tracking-widest text-stone-500 mb-4">Commands Purchased</h3>
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {Object.entries(GOLEM_COMMANDS).map(([category, cmds]) => (
                          <div key={category} className="space-y-2 border border-stone-800 p-4 rounded bg-stone-900/50">
                            <h4 className="text-xs uppercase text-stone-400 font-bold border-b border-stone-800 pb-2 mb-3">{category}</h4>
                            {cmds.map(cmd => {
                              const isSelected = golems[i].commands.includes(cmd.name);
                              return (
                                <label 
                                  key={cmd.name} 
                                  className={`flex items-start gap-3 p-2 rounded cursor-pointer transition-colors border ${
                                    isSelected ? 'bg-stone-800/80 border-stone-600' : 'hover:bg-stone-800/40 border-transparent'
                                  }`}
                                >
                                  <input 
                                    type="checkbox" 
                                    className="mt-1 w-4 h-4 accent-red-700 bg-stone-900 border-stone-700 cursor-pointer"
                                    checked={isSelected}
                                    onChange={() => toggleGolemCommand(i, cmd.name)}
                                  />
                                  <div className="flex-1 leading-snug">
                                    <div className="flex justify-between items-center">
                                      <span className={`font-bold ${isSelected ? 'text-stone-200' : 'text-stone-400'}`}>
                                        {cmd.name}
                                      </span>
                                      <span className="text-xs text-stone-500">({cmd.cost}W)</span>
                                    </div>
                                    <p className="text-xs text-stone-500 mt-1">{cmd.desc}</p>
                                  </div>
                                </label>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                ))}

                {/* Lesser Golems Section */}
                {Array.from({ length: COMPOSITIONS[composition].lesserGolems }).map((_, i) => (
                  <section key={`lesser-golem-${i}`} className="bg-stone-900 border border-stone-800 rounded-xl shadow-2xl overflow-hidden">
                    <div className="bg-[#1a1816] border-b border-stone-800 p-4 sm:p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                      <div className="flex items-center gap-3">
                        <HammerIcon className="text-stone-500" size={24} />
                        <input 
                          type="text" 
                          value={lesserGolems[i].name}
                          onChange={(e) => updateLesserGolem(i, 'name', e.target.value)}
                          className="bg-transparent text-xl font-serif font-bold text-stone-100 focus:outline-none border-b border-dashed border-stone-700 focus:border-stone-500 transition-colors w-full sm:w-auto"
                          placeholder={`Lesser Golem ${i + 1} Name`}
                        />
                      </div>
                      <div className="w-full sm:w-48 shrink-0">
                        <ProgressBar current={getLesserGolemCost(i)} max={COMPOSITIONS[composition].lesserGolemLimit} />
                      </div>
                    </div>
                    
                    <div className="p-4 sm:p-6 border-b border-stone-800 grid gap-2">
                      <h3 className="text-sm font-bold uppercase tracking-widest text-stone-500 mb-2">Attributes</h3>
                      {Object.entries(GOLEM_ATTRS).map(([key, data]) => (
                        <AttributeRow
                          key={key}
                          label={data.name}
                          options={data.options}
                          currentValue={lesserGolems[i][key]}
                          onChange={(val) => updateLesserGolem(i, key, val)}
                        />
                      ))}
                    </div>

                    <div className="p-4 sm:p-6 bg-stone-950/30">
                      <h3 className="text-sm font-bold uppercase tracking-widest text-stone-500 mb-4">Commands Purchased</h3>
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {Object.entries(GOLEM_COMMANDS).map(([category, cmds]) => (
                          <div key={category} className="space-y-2 border border-stone-800 p-4 rounded bg-stone-900/50">
                            <h4 className="text-xs uppercase text-stone-400 font-bold border-b border-stone-800 pb-2 mb-3">{category}</h4>
                            {cmds.map(cmd => {
                              const isSelected = lesserGolems[i].commands.includes(cmd.name);
                              return (
                                <label 
                                  key={cmd.name} 
                                  className={`flex items-start gap-3 p-2 rounded cursor-pointer transition-colors border ${
                                    isSelected ? 'bg-stone-800/80 border-stone-600' : 'hover:bg-stone-800/40 border-transparent'
                                  }`}
                                >
                                  <input 
                                    type="checkbox" 
                                    className="mt-1 w-4 h-4 accent-red-700 bg-stone-900 border-stone-700 cursor-pointer"
                                    checked={isSelected}
                                    onChange={() => toggleLesserGolemCommand(i, cmd.name)}
                                  />
                                  <div className="flex-1 leading-snug">
                                    <div className="flex justify-between items-center">
                                      <span className={`font-bold ${isSelected ? 'text-stone-200' : 'text-stone-400'}`}>
                                        {cmd.name}
                                      </span>
                                      <span className="text-xs text-stone-500">({cmd.cost}W)</span>
                                    </div>
                                    <p className="text-xs text-stone-500 mt-1">{cmd.desc}</p>
                                  </div>
                                </label>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                ))}

                {/* Followers Section */}
                {COMPOSITIONS[composition].followers > 0 && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-serif font-bold text-stone-400 border-b border-stone-800 pb-2 mt-8">
                      Followers
                    </h2>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                      {Array.from({ length: COMPOSITIONS[composition].followers }).map((_, i) => (
                        <section key={`follower-${i}`} className="bg-stone-900 border border-stone-800 rounded-xl shadow-lg overflow-hidden flex flex-col">
                          <div className="bg-[#1a1816] border-b border-stone-800 p-4 flex flex-col gap-2">
                            <input 
                              type="text" 
                              value={followers[i].name}
                              onChange={(e) => updateFollower(i, 'name', e.target.value)}
                              className="bg-transparent text-xl font-serif font-bold text-stone-100 focus:outline-none border-b border-dashed border-stone-700 focus:border-stone-500 transition-colors w-full"
                              placeholder={`Follower ${i + 1}`}
                            />
                            <ProgressBar current={getFollowerCost(i)} max={COMPOSITIONS[composition].followerLimit} />
                          </div>
                          <div className="p-4 grid gap-3 flex-1 text-sm">
                            {Object.entries(FOLLOWER_ATTRS).map(([key, data]) => (
                              <div key={key} className="flex justify-between items-center">
                                <span className="font-bold text-stone-500 uppercase text-xs">{data.name}</span>
                                <select 
                                  className="bg-stone-950 border border-stone-700 text-stone-300 rounded p-1 text-xs focus:border-stone-500 outline-none"
                                  value={followers[i][key]}
                                  onChange={(e) => updateFollower(i, key, e.target.value)}
                                >
                                  {data.options.map(opt => (
                                    <option key={opt.val} value={opt.val}>{opt.val} ({opt.cost}W)</option>
                                  ))}
                                </select>
                              </div>
                            ))}
                          </div>
                        </section>
                      ))}
                    </div>
                  </div>
                )}

              </main>

              <footer className="text-center p-8 text-stone-600 text-xs mt-12 border-t border-stone-900 bg-black">
                Golem28 Simulacra Builder. Built for the skirmish kitbasher.
              </footer>
            </div>
          );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
